<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="File not found - custom interactive futuristic 404 redirection page.">
    <title>404: Node Disconnected | Adeeb Saifi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">

    <style>
        .error-layout {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, rgba(10, 10, 12, 1) 80%);
        }

        .cyber-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            perspective: 500px;
            transform: rotateX(60deg) translateY(-30%);
            transform-origin: top;
            opacity: 0.4;
            z-index: 1;
        }

        .error-code {
            font-size: 10rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            z-index: 2;
            animation: float 5s ease-in-out infinite;
        }

        .error-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: var(--text-primary);
            position: relative;
            z-index: 2;
        }

        .error-desc {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            max-width: 450px;
            position: relative;
            z-index: 2;
        }

        .error-action {
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>

    <!-- Custom Cursor -->
    <div class="custom-cursor" aria-hidden="true"></div>
    <div class="custom-cursor-dot" aria-hidden="true"></div>

    <div class="error-layout">
        <div class="cyber-grid"></div>

        <div class="error-code">404</div>
        <h1 class="error-title">SYSTEM_NODE_DISCONNECTED</h1>
        <p class="error-desc">The specific timeline, matrix coordinate, or design node you are searching for does not exist in this database cluster.</p>

        <div class="error-action">
            <a href="index.html" class="btn btn-primary">Recalibrate Home Coordinate ↗</a>
        </div>
    </div>

    <!-- Global scripts -->
    <script src="js/main.js"></script>
</body>
</html>
